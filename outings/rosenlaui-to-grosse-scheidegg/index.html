  <meta property="og:description" content="Hike through a lush and scenic alpine valley. The path transitions from shaded forest into wide, lush pastures. You will pass through Schwarzwaldalp, a hamlet featuring a historic water-powered sawmill and a mountain restaurant. As you make the final, steeper push toward the pass, the terrain opens up completely. You are treated to massive, up-close views of the jagged Engelhörner peaks and the sheer limestone face of the Wetterhorn. The hike concludes at Grosse Scheidegg (1,962 meters), a spectacular ridge separating the Meiringen and Grindelwald valleys. From the summit, you can enjoy panoramic views of the famous Eiger mountain.">
